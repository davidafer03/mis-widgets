<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px 5px;
      font-family: 'Montserrat', sans-serif;
      background: transparent;
    }

    .calendar-wrapper {
      display: flex;
      gap: 15px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Tarjeta principal estilo Retro Dark */
    .card {
      background: linear-gradient(145deg, #2a2621, #1a1714);
      border: 1px solid #7a6234;
      border-radius: 12px;
      padding: 12px 16px;
      width: 230px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 215, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    /* Brillo superior al pasar el cursor */
    .card:hover {
      transform: translateY(-4px);
      border-color: #d4af37;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .dia-semana {
      font-size: 10px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .titulo {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin: 1px 0;
      line-height: 1.2;
    }

    /* --- PALETA DE COLORES PERSONALIZADA --- */
    .badge {
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    
    /* Ligas - Marroncito claro / Dorado */
    .badge-ligas { 
      background: linear-gradient(135deg, #c29b38, #8c6e21); 
      color: #ffffff; 
      border: 1px solid #e5bd57;
    }
    
    /* Intercontinental - Azul estilo Champions */
    .badge-intercontinental { 
      background: linear-gradient(135deg, #0e1e5b, #070f30); 
      color: #00d4ff; 
      border: 1px solid #00d4ff;
      text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
    }
    
    /* Copa Leyendas - Naranja */
    .badge-copa { 
      background: linear-gradient(135deg, #ff7700, #b35300); 
      color: #ffffff; 
      border: 1px solid #ff9d42;
    }
    
    /* Mercado - Verde Fosforito */
    .badge-mercado { 
      background: #39ff14; 
      color: #052600; 
      font-weight: 900;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
    }

    /* Placa Dorada para las Fechas */
    .fecha-box {
      text-align: center;
      background: linear-gradient(180deg, #e5ca7d 0%, #a38136 100%);
      border: 1px solid #fff2bf;
      padding: 6px 10px;
      border-radius: 8px;
      min-width: 48px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .num {
      font-size: 22px;
      font-weight: 900;
      color: #1a1405;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }

    .mes {
      font-size: 9px;
      color: #2b2108;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">

    <!-- PARTIDO 1 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Viernes</span>
        <span class="titulo">Jornada 28</span>
        <span class="badge badge-ligas">LIGAS</span>
      </div>
      <div class="fecha-box">
        <div class="num">31</div>
        <div class="mes">JUL</div>
      </div>
    </div>

    <!-- PARTIDO 2 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Lunes</span>
        <span class="titulo">Jornada 29</span>
        <span class="badge badge-ligas">LIGAS</span>
      </div>
      <div class="fecha-box">
        <div class="num">3</div>
        <div class="mes">AGO</div>
      </div>
    </div>

    <!-- PARTIDO 3 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Miércoles</span>
        <span class="titulo">Vuelta Semifinales</span>
        <span class="badge badge-intercontinental">INTERCONTINENTAL</span>
      </div>
      <div class="fecha-box">
        <div class="num">5</div>
        <div class="mes">AGO</div>
      </div>
    </div>

    <!-- PARTIDO 4 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Lunes</span>
        <span class="titulo">Envío de Listas</span>
        <span class="badge badge-mercado">MERCADO</span>
      </div>
      <div class="fecha-box">
        <div class="num">17</div>
        <div class="mes">AGO</div>
      </div>
    </div>

  </div>

</body>
</html>
