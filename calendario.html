<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap');

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    body {
      padding: 4px 0;
      display: flex;
      align-items: center;
    }

    .calendar-wrapper {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;
      height: 100%;
      min-height: 110px;
    }

    /* ESTILO BASE DE LAS TARJETAS */
    .card {
      flex: 1;
      border-radius: 12px;
      padding: 22px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }

    .card:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }

    /* --- FONDOS POR COMPETICIÓN --- */
    .card-ligas {
      background: linear-gradient(135deg, #6e541b 0%, #302307 100%);
      border: 1px solid #d4af37;
    }
    .card-ligas .dia-semana { color: #f3e5ab; }
    .card-ligas .badge { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

    .card-intercontinental {
      background: linear-gradient(135deg, #0b2545 0%, #134074 50%, #00121e 100%);
      border: 1px solid #00d4ff;
    }
    .card-intercontinental .dia-semana { color: #80e5ff; }
    .card-intercontinental .badge { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid #00d4ff; }

    .card-copa {
      background: linear-gradient(135deg, #8a3300 0%, #3b1400 100%);
      border: 1px solid #ff7700;
    }
    .card-copa .dia-semana { color: #ffc299; }
    .card-copa .badge { background: rgba(255, 119, 0, 0.25); color: #ffffff; border: 1px solid #ff9d42; }

    .card-mercado {
      background: linear-gradient(135deg, #11420b 0%, #051a02 100%);
      border: 1px solid #39ff14;
    }
    .card-mercado .dia-semana { color: #a1ff90; }
    .card-mercado .badge { background: #39ff14; color: #052600; font-weight: 900; }

    /* TEXTOS */
    .info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 2;
    }

    .dia-semana {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .titulo {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      margin: 1px 0;
      line-height: 1.2;
    }

    .badge {
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .fecha-box {
      text-align: center;
      background: linear-gradient(180deg, #1f1b18 0%, #100e0c 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 50px;
      z-index: 2;
    }

    .num {
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .mes {
      font-size: 10px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 3px;
    }
  </style>
</head>
<body style="background: transparent !important;">

  <!-- Contenedor dinámico -->
  <div class="calendar-wrapper" id="calendar-container"></div>

  <script>
    // ==========================================
    // 1. TU LISTA COMPLETA DE EVENTOS AQUÍ
    // Formato de fecha obligatorio: "AAAA-MM-DD"
    // Tipos disponibles: 'ligas', 'intercontinental', 'copa', 'mercado'
    // ==========================================
    const TODOS_LOS_EVENTOS = [
      { fecha: "2026-07-31", dia: "Viernes", titulo: "Jornada 28", tipo: "ligas", badge: "LIGAS" },
      { fecha: "2026-08-03", dia: "Lunes", titulo: "Jornada 29", tipo: "ligas", badge: "LIGAS" },
      { fecha: "2026-08-05", dia: "Miércoles", titulo: "Vuelta Semis", tipo: "intercontinental", badge: "INTERCONTINENTAL" },
      { fecha: "2026-08-17", dia: "Lunes", titulo: "Envío Listas", tipo: "mercado", badge: "MERCADO" },
      { fecha: "2026-08-20", dia: "Jueves", titulo: "Final Copa", tipo: "copa", badge: "COPA" },
      { fecha: "2026-08-25", dia: "Martes", titulo: "Jornada 30", tipo: "ligas", badge: "LIGAS" }
    ];

    const MESES = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

    function renderizarCalendario() {
      const hoy = new Date();
      // Ajuste para comparar solo fechas sin horas
      hoy.setHours(0, 0, 0, 0);

      // Filtrar eventos futuros o de hoy
      const eventosFuturos = TODOS_LOS_EVENTOS.filter(evento => {
        const fechaEv = new Date(evento.fecha + "T00:00:00");
        return fechaEv >= hoy;
      });

      // Tomar solo los primeros 4 eventos
      const proximosEventos = eventosFuturos.slice(0, 4);

      const contenedor = document.getElementById("calendar-container");
      contenedor.innerHTML = "";

      proximosEventos.forEach(ev => {
        const fechaObj = new Date(ev.fecha + "T00:00:00");
        const numeroDia = fechaObj.getDate();
        const nombreMes = MESES[fechaObj.getMonth()];

        const card = document.createElement("div");
        card.className = `card card-${ev.tipo}`;
        card.innerHTML = `
          <div class="info">
            <span class="dia-semana">${ev.dia}</span>
            <span class="titulo">${ev.titulo}</span>
            <span class="badge">${ev.badge}</span>
          </div>
          <div class="fecha-box">
            <div class="num">${numeroDia}</div>
            <div class="mes">${nombreMes}</div>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Ejecutar al cargar la página
    renderizarCalendario();
  </script>
</body>
</html>
