<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap');

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    /* Padding horizontal en body para evitar que sombras generen franjas oscuras */
    body {
      padding: 4px 8px;
    }

    .calendar-wrapper {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;
      height: 100%;
    }

    /* ESTILO BASE DE LAS TARJETAS */
    .card {
      flex: 1;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      /* Sombra limpia sin destellos grises desparramados */
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
      min-width: 0;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      filter: brightness(1.08);
    }

    /* --- FONDOS POR COMPETICIÓN --- */

    /* LIGAS (Dorado / Bronce) */
    .card-ligas {
      background: linear-gradient(135deg, #6e541b 0%, #302307 100%);
      border: 1px solid #d4af37;
    }
    .card-ligas .dia-semana { color: #f3e5ab; }
    .card-ligas .badge { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }

    /* INTERCONTINENTAL (Azul Eléctrico / Noche) */
    .card-intercontinental {
      background: linear-gradient(135deg, #0b2545 0%, #134074 50%, #00121e 100%);
      border: 1px solid #00d4ff;
    }
    .card-intercontinental .dia-semana { color: #80e5ff; }
    .card-intercontinental .badge { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border: 1px solid #00d4ff; }

    /* COPA (Naranja Fuego) */
    .card-copa {
      background: linear-gradient(135deg, #8a3300 0%, #3b1400 100%);
      border: 1px solid #ff7700;
    }
    .card-copa .dia-semana { color: #ffc299; }
    .card-copa .badge { background: rgba(255, 119, 0, 0.25); color: #ffffff; border: 1px solid #ff9d42; }

    /* MERCADO (Verde Neón / Oscuro) */
    .card-mercado {
      background: linear-gradient(135deg, #11420b 0%, #051a02 100%);
      border: 1px solid #39ff14;
    }
    .card-mercado .dia-semana { color: #a1ff90; }
    .card-mercado .badge { background: #39ff14; color: #052600; font-weight: 900; }

    /* --- TEXTOS INTERNOS --- */
    .info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 2;
    }

    .dia-semana {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .titulo {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      margin: 1px 0;
      line-height: 1.2;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }

    .badge {
      font-size: 9px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* PLACA DE LA FECHA */
    .fecha-box {
      text-align: center;
      background: linear-gradient(180deg, #1f1b18 0%, #100e0c 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 8px;
      border-radius: 8px;
      min-width: 44px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 2;
    }

    .num {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .mes {
      font-size: 9px;
      color: #d4af37;
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="calendar-wrapper">

    <!-- PARTIDO 1 -->
    <div class="card card-ligas">
      <div class="info">
        <span class="dia-semana">Viernes</span>
        <span class="titulo">Jornada 28</span>
        <span class="badge">LIGAS</span>
      </div>
      <div class="fecha-box">
        <div class="num">31</div>
        <div class="mes">JUL</div>
      </div>
    </div>

    <!-- PARTIDO 2 -->
    <div class="card card-ligas">
      <div class="info">
        <span class="dia-semana">Lunes</span>
        <span class="titulo">Jornada 29</span>
        <span class="badge">LIGAS</span>
      </div>
      <div class="fecha-box">
        <div class="num">3</div>
        <div class="mes">AGO</div>
      </div>
    </div>

    <!-- PARTIDO 3 -->
    <div class="card card-intercontinental">
      <div class="info">
        <span class="dia-semana">Miércoles</span>
        <span class="titulo">Vuelta Semifinales</span>
        <span class="badge">INTERCONTINENTAL</span>
      </div>
      <div class="fecha-box">
        <div class="num">5</div>
        <div class="mes">AGO</div>
      </div>
    </div>

    <!-- PARTIDO 4 -->
    <div class="card card-mercado">
      <div class="info">
        <span class="dia-semana">Lunes</span>
        <span class="titulo">Envío de Listas</span>
        <span class="badge">MERCADO</span>
      </div>
      <div class="fecha-box">
        <div class="num">17</div>
        <div class="mes">AGO</div>
      </div>
    </div>

  </div>

</body>
</html>
