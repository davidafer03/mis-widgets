<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px;
      font-family: Arial, sans-serif;
      background: transparent;
    }
    .container {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      width: 180px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .info { display: flex; flex-direction: column; }
    .dia-semana { font-size: 11px; color: #888; text-transform: uppercase; }
    .titulo { font-size: 14px; font-weight: bold; margin: 4px 0; color: #333; }
    .liga { font-size: 11px; color: #d9534f; font-weight: bold; }
    .fecha-box { text-align: center; background: #f4f4f4; padding: 6px 10px; border-radius: 6px; }
    .num { font-size: 20px; font-weight: bold; color: #111; }
    .mes { font-size: 10px; color: #666; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tarjeta 1 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Viernes</span>
        <span class="titulo">Jornada 5</span>
        <span class="liga">Liga 1</span>
      </div>
      <div class="fecha-box">
        <div class="num">31</div>
        <div class="mes">JUL</div>
      </div>
    </div>

    <!-- Tarjeta 2 -->
    <div class="card">
      <div class="info">
        <span class="dia-semana">Lunes</span>
        <span class="titulo">Jornada 6</span>
        <span class="liga">Liga 1</span>
      </div>
      <div class="fecha-box">
        <div class="num">3</div>
        <div class="mes">AGO</div>
      </div>
    </div>
  </div>

</body>
</html>
